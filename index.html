<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPECTRA AI Detector</title><style>*{box-sizing:border-box}body{margin:0;background:#090c10;color:#eef1f3;font-family:Arial}.w{width:min(92%,850px);margin:auto}nav{padding:20px 0;border-bottom:1px solid #252b33}.logo{font-weight:700;font-size:20px}.logo b{color:#3fd9c7}.hero{text-align:center;padding:55px 0 25px}.hero h1{font-size:48px;margin:0 0 12px}.hero h1 span{color:#3fd9c7}.hero p{color:#8e97a5}.box{background:#12161c;border:1px solid #2b313a;border-radius:10px;padding:22px;margin:25px 0 70px}.tabs{display:flex;gap:8px}.tab{flex:1;padding:12px;background:#1a1f27;color:#aaa;border:1px solid #303742;border-radius:5px}.tab.active{color:#3fd9c7;border-color:#3fd9c7}.drop{display:block;margin-top:18px;padding:45px;text-align:center;border:2px dashed #38404b;border-radius:8px;cursor:pointer}.drop:hover{border-color:#3fd9c7}#file{display:none}.name{color:#3fd9c7;font-size:13px;margin-top:10px;word-break:break-all}.preview{text-align:center;margin-top:18px}.preview img,.preview video{max-width:100%;max-height:380px;border-radius:7px}.preview audio{width:100%}.scan{width:100%;margin-top:18px;padding:14px;background:#3fd9c7;border:0;border-radius:5px;font-weight:bold}.scan:disabled{opacity:.45}.result{display:none;margin-top:18px;background:#181d25;border:1px solid #303742;border-radius:7px;padding:20px}.result.show{display:block}.v{font-size:25px;font-weight:bold}.ai{color:#ff6a4d}.real{color:#3fd9c7}.warn{color:#e8b04b}.meter{height:8px;background:#292f38;margin:15px 0;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:#3fd9c7;width:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#11151a;border:1px solid #292f38;font-size:13px;color:#a5adba}.stat b{float:right;color:#fff}.err{color:#ff6a4d;margin-top:12px;font-size:13px}@media(max-width:600px){.hero h1{font-size:36px}.stats{grid-template-columns:1fr}}</style></head><body><nav><div class=w><div class=logo><b>●</b> SPECTRA</div></div></nav><section class=hero><div class=w><h1>AI Content <span>Detector</span></h1><p>Upload media and analyze it with a server-side AI model.</p></div></section><main class=w><div class=box><div class=tabs><button class="tab active" data-t=image>Image</button><button class=tab data-t=video>Video</button><button class=tab data-t=audio>Audio</button></div><label class=drop for=file><strong>Choose a file</strong><br><small id=help>JPG, PNG, WEBP</small><div class=name id=name>No file selected</div></label><input id=file type=file accept="image/*"><div id=preview class=preview></div><button id=scan class=scan disabled>Analyze Media</button><div id=result class=result><div id=v class=v>—</div><div id=c></div><div class=meter><i id=m></i></div><div id=s class=stats></div><div id=e class=err></div></div></div></main><script>const T=[...document.querySelectorAll('.tab')],F=document.getElementById('file'),P=document.getElementById('preview'),N=document.getElementById('name'),B=document.getElementById('scan'),R=document.getElementById('result'),V=document.getElementById('v'),C=document.getElementById('c'),M=document.getElementById('m'),S=document.getElementById('s'),E=document.getElementById('e'),H=document.getElementById('help');let type='image',chosen=null,url=null;const ht={image:'JPG, PNG, WEBP',video:'MP4, MOV, WEBM',audio:'MP3, WAV, M4A, OGG'};T.forEach(x=>x.onclick=()=>{T.forEach(y=>y.classList.remove('active'));x.classList.add('active');type=x.dataset.t;F.accept=type==='image'?'image/*':type==='video'?'video/*':'audio/*';H.textContent=ht[type];reset()});function reset(){F.value='';chosen=null;P.innerHTML='';N.textContent='No file selected';B.disabled=true;R.classList.remove('show');if(url)URL.revokeObjectURL(url)}F.onchange=()=>{chosen=F.files[0];if(!chosen)return;N.textContent=chosen.name+' — '+(chosen.size/1048576).toFixed(2)+' MB';url=URL.createObjectURL(chosen);P.innerHTML='';let x=type==='image'?new Image():document.createElement(type);x.src=url;if(type!=='image')x.controls=true;P.appendChild(x);B.disabled=false};B.onclick=async()=>{B.disabled=true;R.classList.add('show');V.textContent='Analyzing…';V.className='v warn';C.textContent='Uploading and running model…';M.style.width='10%';S.innerHTML='';E.textContent='';let f=new FormData();f.append('file',chosen);f.append('type',type);try{let q=await fetch('/api/scan',{method:'POST',body:f}),d=await q.json();if(!q.ok)throw Error(d.error||'Scan failed');M.style.width=d.ai_probability+'%';V.textContent=d.verdict;V.className='v '+(d.verdict.includes('AI')?'ai':'real');C.textContent='AI probability: '+d.ai_probability+'% | Real probability: '+d.real_probability+'%';S.innerHTML=(d.signals||[]).map(a=>'<div class=stat>'+a.name+'<b>'+a.value+'</b></div>').join('')}catch(x){V.textContent='Scan unavailable';V.className='v warn';C.textContent='';E.textContent=x.message}B.disabled=false}</script></body></html>
